name: carzon
description: "Carzon — Moldova car marketplace (Flutter mobile client)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  # Localization: Russian is the MVP product language (Transnistria
  # launch). Romanian (ro) and English (en) are planned but intentionally
  # not added in this pass — see lib/l10n/README.md and l10n.yaml.
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.0.3

  # Routing
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.0

  # Native deep-link plumbing for Supabase auth callbacks
  # (password recovery / email confirmation links back into the app).
  # Pulled in via supabase_flutter transitively; declared explicitly
  # because lib/core/services/auth_deep_link_service.dart imports it.
  app_links: ^7.0.0

  # Configuration
  flutter_dotenv: ^5.2.1

  # Local persisted listing discovery defaults
  shared_preferences: ^2.5.4

  # Media (MVP: single cover image picker for create-listing)
  image_picker: ^1.1.2

  # External actions (Call / Telegram / WhatsApp buttons on listing details)
  url_launcher: ^6.3.2

  # SVG rendering for curated car-brand icons. Icons are resolved via
  # `lib/shared/brands/brand_icon_resolver.dart` which maps free-text
  # `make` values to assets under `assets/brands/svg/`.
  flutter_svg: ^2.0.7
  lucide_icons: ^0.257.0
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/brands/svg/
    - assets/categories/svg/
    - assets/contact/whatsapp.svg
    - assets/bg/bg_chat.jpg
