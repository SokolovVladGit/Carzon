# Flutter gen-l10n configuration for Carzon.
#
# The Carzon MVP launches first in Transnistria, where Russian is the
# primary product language. Romanian (`ro`) and English (`en`) are
# planned future locales and will be added as `app_ro.arb` / `app_en.arb`
# in a later pass. Do not add placeholder Romanian or English ARB files
# before those translations are actually done.
arb-dir: lib/l10n
template-arb-file: app_ru.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
