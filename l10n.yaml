# Flutter gen-l10n configuration for Carzon.
#
# Template locale is Russian (`app_ru.arb`). Romanian (`app_ro.arb`) must
# keep full key parity with the template. English is not supported yet.
arb-dir: lib/l10n
template-arb-file: app_ru.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
