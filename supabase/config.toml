# Supabase CLI configuration.
# Full local-development options: https://supabase.com/docs/guides/cli/config

# Invoked by cron or manual server calls using x-carzon-internal-secret only (no user JWT).
# Automatic invoke (Phase 3E): pg_cron + pg_net + Vault — see migration
# `20260529120000_schedule_process_message_notifications_cron.sql` and docs/ops_message_notifications.md
# Phase 4A filter alerts: migration `20260601120000_filter_alert_notifications_queue_and_cron.sql`
[functions.process-message-notifications]
verify_jwt = false

[functions.process-filter-alert-notifications]
verify_jwt = false

# P2 V1 price drop favorites worker (internal secret only; no user JWT).
# Automatic invoke: pg_cron + pg_net + Vault — migration
# `20260802120000_price_drop_favorite_notifications.sql`
[functions.process-price-drop-notifications]
verify_jwt = false

# Phase 2B VIN decode worker (internal secret only; no user JWT).
# Automatic invoke (Phase 2C scheduler): pg_cron + pg_net + Vault — migration
# `20260621120000_schedule_process_vin_decode_jobs_cron.sql` and docs/ops_vin_decode_jobs.md
[functions.process-vin-decode-jobs]
verify_jwt = false

# Model Passport Phase 1 worker (internal secret only; no user JWT).
# Automatic invoke: pg_cron + pg_net + Vault — migration
# `20260706123000_schedule_process_model_data_jobs_cron.sql` and docs/ops_model_data_jobs.md
[functions.process-model-data-jobs]
verify_jwt = false

# Recall / Safety Campaigns Phase 2 worker (internal secret only; no user JWT).
# Automatic invoke: pg_cron + pg_net + Vault — migration
# `20260707123000_schedule_process_recall_data_jobs_cron.sql` and docs/ops_recall_data_jobs.md
[functions.process-recall-data-jobs]
verify_jwt = false

# Authenticated self-service account deletion (user JWT required).
[functions.delete-own-account]
verify_jwt = true
